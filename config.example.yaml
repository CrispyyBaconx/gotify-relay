server:
  listen_addr: ":8080"

gotify:
  url: "${GOTIFY_URL}"

subscriptions:
  path: "/data/subscriptions.json"

members:
  bacon:
    token: "${BACON_MEMBER_TOKEN}"
    app_token: "${BACON_GOTIFY_APP_TOKEN}"

  bow:
    token: "${BOW_MEMBER_TOKEN}"
    app_token: "${BOW_GOTIFY_APP_TOKEN}"

channels:
  infra:
    default_subscribed: true

  deploys:
    default_subscribed: false

  personal:
    default_subscribed: false

callers:
  uptime-kuma:
    token: "${UPTIME_KUMA_RELAY_TOKEN}"
    channels:
      - infra

  deploy-hook:
    token: "${DEPLOY_HOOK_RELAY_TOKEN}"
    channels:
      - deploys
