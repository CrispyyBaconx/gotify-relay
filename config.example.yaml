server:
  listen_addr: ":8080"

gotify:
  url: "${GOTIFY_URL}"

subscriptions:
  path: "/data/subscriptions.json"

members:
  bacon:
    token: "${BACON_MEMBER_TOKEN}"
    app_token: "${BACON_GOTIFY_APP_TOKEN}"

  bow:
    token: "${BOW_MEMBER_TOKEN}"
    app_token: "${BOW_GOTIFY_APP_TOKEN}"

channels:
  infra:
    default_subscribed: true

  deploys:
    default_subscribed: false

  personal:
    default_subscribed: false

# Caller tokens are generated once per caller and persisted to
# /data/caller-tokens.json. Use GET /callers with a member token
# to retrieve them. Tokens are stable across restarts.
callers:
  uptime-kuma:
    channels:
      - infra

  deploy-hook:
    channels:
      - deploys
